<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-in and Log-in</title>
    <link rel="stylesheet" href="log-in.css">
</head>

<body>

    <main class="container">
        <form>

            <h1 id="title">Login</h1>

            <div class="input-box">
                <input type="email" placeholder="Email" required>
            </div>

            <div class="input-box">
                <input type="password" placeholder="Password" id="senha" required>
                <img src="icons/eye_closed.png" alt="" id="password-eye">
            </div>

            <div class="remember">
                <label>
                <input type="checkbox">
            Keep me logged in
                </label>
                <a href="">Forgot my password</a>
            </div>

            <button class="login" type="submit">Submit</button>

            <div class="register-link">
                <p>Don't have an account? <a href="sign-in_page.html">Sign-in</a></p>

            </div>

        </form>

    </main> 
    <script src="index.js"></script>
</body>

</html>
